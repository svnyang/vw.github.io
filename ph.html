    let usedIndices = [];
    let displayCount = 0;

    function init() {
        displayAllQuotes();
        setRandomTitle();
        document.getElementById('refresh-button').addEventListener('click', setRandomTitle);
        updateCounter();
    }

    function displayAllQuotes() {
        const container = document.getElementById('quotes-container');
        container.innerHTML = '';
        quotes.forEach(text => {
            const div = document.createElement('div');
            div.className = 'quote-item';
            div.innerHTML = `<div class="english">${text}</div>`;
            container.appendChild(div);
        });
    }

    function getRandomQuoteIndex() {
        if (usedIndices.length >= quotes.length) usedIndices = [];
        let index;
        do { index = Math.floor(Math.random() * quotes.length); }
        while (usedIndices.includes(index));
        usedIndices.push(index);
        return index;
    }

    function setRandomTitle() {
        const index = getRandomQuoteIndex();
        const text = quotes[index];

        document.title = text + " | Thank you everyone for your likes and follows.";
        document.getElementById('current-title').textContent = text;

        displayCount++;
        updateCounter();
        highlightCurrentQuote(index);
        showNotification(`Page title updated to: "${text}"`);
    }

    function highlightCurrentQuote(index) {
        document.querySelectorAll('.quote-item').forEach(item => {
            item.style.background = '#f8f9fa';
            item.querySelector('.english').classList.remove('highlight');
        });

        const items = document.querySelectorAll('.quote-item');
        if (items[index]) {
            items[index].style.background = '#e8f4fc';
            items[index].querySelector('.english').classList.add('highlight');
            items[index].scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    }

    function updateCounter() {
        document.getElementById('counter').textContent =
            `Title changed ${displayCount} times | Showing ${usedIndices.length} / ${quotes.length}`;
    }

    function showNotification(message) {
        const n = document.createElement('div');
        n.style.cssText = `
            position: fixed; top: 20px; right: 20px;
            background: #4a6fa5; color: #fff;
            padding: 15px 25px; border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            animation: slideIn .3s ease-out;
        `;
        n.textContent = message;
        document.body.appendChild(n);
        setTimeout(() => {
            n.style.animation = 'slideOut .3s ease-out forwards';
            setTimeout(() => n.remove(), 300);
        }, 3000);
    }

    const style = document.createElement('style');
    style.textContent = `
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
    `;
    document.head.appendChild(style);

    document.addEventListener('DOMContentLoaded', init);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) setRandomTitle(); });
</script>
